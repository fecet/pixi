[project]
channels = ["conda-forge"]
description = "Test project for interpreter functionality"
name = "test-interpreter"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.8"

[tasks]
# Test single interpreter string (backward compatibility)
test-bash = { cmd = "echo 'Hello from bash'", interpreter = "bash" }

# Test same interpreter as array format
test-bash-array = { cmd = "echo 'Hello from bash array'", interpreter = [
    "bash",
] }

# Test interpreter array with python
test-python = { cmd = "print('Hello from python')", interpreter = ["python"] }

# Test interpreter array with python and flags
test-python-flags = { cmd = "print('Hello from python with flags')", interpreter = [
    "python",
    "-u",
] }

# Test without interpreter (should use deno_task_shell)
test-no-interpreter = { cmd = "echo 'Hello from deno_task_shell'" }

# Test complex script with multiple lines
test-complex = { cmd = """
for i in {1..3}; do
    echo "Line $i"
done
""", interpreter = "bash" }
