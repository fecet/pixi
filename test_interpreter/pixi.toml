[project]
name = "interpreter-test"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.8"

[tasks]
# Traditional stdin approach
python-stdin = { cmd = "print(\"Hello from stdin\")", interpreter = ["python"] }

# Temporary file approach
python-tempfile = { cmd = "print(\"Hello from temp file\")", interpreter = ["python", "-"] }

# Inline script approach  
python-inline = { cmd = "print(\"Hello from inline\")", interpreter = ["python", "-c", "@"] }

# Multiple placeholders
python-multi = { cmd = "print(\"Multiple placeholders\")", interpreter = ["python", "-", "--verbose", "-"] }

# Explicit stdin (discouraged)
python-explicit = { cmd = "print(\"Explicit stdin\")", interpreter = ["python", "<"] }

# Complex script with tempfile
python-complex = { cmd = """
import sys
import os
print(f\"Script file: {__file__ if \"__file__\" in globals() else \"N/A\"}")
print(f\"Python version: {sys.version}\")
print(f\"Current directory: {os.getcwd()}\")
""", interpreter = ["python", "-"] }
